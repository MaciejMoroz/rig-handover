name: job-1-worker
on: [push]
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node worker.js
        env:
          JOB1_URL: ${{ secrets.JOB1_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: job-1-result
          path: |
            result.txt
            receipt.txt
            worker-log.md
        if: always()
